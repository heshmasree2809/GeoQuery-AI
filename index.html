<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SatQuery AI</title>
<style>
:root{--bg:#fff;--fg:#14213d;--mut:#5c677d;--card:#f3f5f9;--acc:#1d4ed8;--bd:#d9dee8}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e6ebf5;--mut:#9aa7bd;--card:#141d30;--acc:#6ea0ff;--bd:#27334d}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:980px;margin:0 auto;padding:24px 16px}h1{margin:0}p.s{color:var(--mut);margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,button{font:inherit;color:var(--fg)}input[type=text],input[type=number]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}img{max-width:100%;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.warn{color:#b45309}.mut{color:var(--mut);font-size:13px}
</style></head><body><main>
<h1>🛰️ SatQuery AI</h1><p class="s">Ask questions. Explore Earth. Every answer has pixels behind it.</p>
<div class="card">
<label>Question</label><input id="q" type="text" value="How much of this scene is water?" maxlength="500">
<div class="grid"><div><label>Image (date A) *</label><input id="a" type="file" accept="image/*"></div>
<div><label>Image (date B, for change questions)</label><input id="b" type="file" accept="image/*"></div>
<div><label>NIR band (optional, enables NDVI)</label><input id="n" type="file" accept="image/*"></div>
<div><label>Ground sample distance (m / pixel)</label><input id="g" type="number" value="10" min="0.1" step="any"></div></div>
<button id="go">Analyse</button> <span id="st" class="mut"></span></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("go").onclick=async()=>{
 if(!$("a").files[0]){$("st").textContent="Choose an image first.";return}
 const f=new FormData();f.append("question",$("q").value);f.append("image",$("a").files[0]);
 if($("b").files[0])f.append("image_b",$("b").files[0]);if($("n").files[0])f.append("nir",$("n").files[0]);
 f.append("gsd",$("g").value);$("go").disabled=true;$("st").textContent="Analysing…";
 try{const r=await fetch("/api/query",{method:"POST",body:f});const d=await r.json();
  if(!r.ok)throw new Error(d.detail||r.statusText);render(d);$("st").textContent="";}
 catch(e){$("st").textContent="Error: "+e.message}finally{$("go").disabled=false}};
function render(d){
 $("out").innerHTML=`<div class="card"><h3>Answer</h3><p>${esc(d.answer)}</p>
 <p class="mut">Scene: ${d.scene.area_km2} km² · ${d.scene.gsd_m.toFixed(2)} m/px</p></div>
 <div class="card"><h3>Plan</h3><ol>${d.plan.map(s=>`<li><b>${esc(s.tool)}</b> — ${esc(s.why)}</li>`).join("")}</ol></div>
 <div class="card"><h3>Evidence</h3><div class="grid">${d.evidence.map(e=>`<figure style="margin:0"><img src="${e.image}" alt="${esc(e.title)}"><figcaption><b>${esc(e.title)}</b><br><span class="mut">${esc(e.method)}</span></figcaption></figure>`).join("")}</div></div>
 <div class="card"><h3>Evidence trail</h3><table><tr><th>Claim</th><th>Pixels</th><th>Measurement</th><th>Method</th></tr>
 ${d.evidence_trail.map(t=>`<tr><td>${esc(t.claim)}</td><td>${esc(t.pixels)}</td><td>${esc(t.measurement)}</td><td>${esc(t.method)}</td></tr>`).join("")}</table></div>`;}
</script></main></body></html>
